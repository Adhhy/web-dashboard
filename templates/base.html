<!DOCTYPE html>
<html lang="en">

<head>

    <title>{% block title %}Attendance Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_styles %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

</body>

</html>
