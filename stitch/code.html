<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In - Institutional Dashboard</title>
<!-- Load Tailwind CSS v3 with forms and container-queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Font: Inter as specified in the theme -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#0f49bd', // Custom color from THEME_2
              dark: '#0a3a96',
            },
            background: '#f8f9fa', // Very light gray background
          },
          borderRadius: {
            'theme': '4px', // ROUND_FOUR from THEME_2
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Ensure the body takes full height for vertical centering */
    body, html {
      height: 100%;
      margin: 0;
    }
    
    /* Subtle background pattern to mimic the screenshot's soft gradients */
    .bg-soft-pattern {
      background-color: #f8f9fa;
      background-image: radial-gradient(circle at 10% 20%, rgba(15, 73, 189, 0.03) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(15, 73, 189, 0.03) 0%, transparent 40%);
    }

    /* Specific border-top for the login card as seen in the screenshot */
    .card-accent-top {
      border-top: 4px solid #0f49bd;
    }
  </style>
</head>
<body class="bg-soft-pattern font-sans flex items-center justify-center p-4 min-h-screen">
<!-- BEGIN: LoginContainer -->
<div class="flex flex-row items-start max-w-2xl w-full">
<!-- Role Selection Tabs -->
<nav aria-label="Role selection" class="flex flex-col space-y-1 mt-1">
<button aria-current="page" class="flex items-center font-semibold text-white bg-brand rounded-l-theme shadow-md border-r-0 transform transition-transform hover:translate-x-1 focus:outline-none px-6 py-4 text-base" type="button">
      Student
    </button>
<button class="flex items-center font-semibold text-gray-600 bg-white hover:bg-gray-50 rounded-l-theme shadow-sm border-r-0 transform transition-transform hover:translate-x-1 focus:outline-none px-6 py-4 text-base" type="button">
      Advisor
    </button>
<button class="flex items-center font-semibold text-gray-600 bg-white hover:bg-gray-50 rounded-l-theme shadow-sm border-r-0 transform transition-transform hover:translate-x-1 focus:outline-none px-6 py-4 text-base" type="button">
      Faculty
    </button>
</nav>
<!-- Login Card -->
<main class="flex-1 bg-white shadow-xl rounded-r-theme rounded-bl-theme card-accent-top overflow-hidden z-10" data-purpose="login-container">
<div class="px-8 pt-10 pb-12">
<!-- BEGIN: FormHeader -->
<header class="text-center mb-10">
<h1 class="text-2xl font-bold text-gray-900">Sign In</h1>
</header>
<!-- END: FormHeader -->
<!-- BEGIN: SignInForm -->
<form action="#" class="space-y-6" data-purpose="signin-form" method="POST">
<!-- Username Field -->
<div class="space-y-2">
<label class="flex items-center text-sm font-semibold text-gray-700" for="username">
<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
            Username
          </label>
<input class="block w-full px-4 py-3 text-gray-900 border border-gray-200 rounded-theme focus:ring-brand focus:border-brand placeholder-gray-400 text-sm" id="username" name="username" placeholder="e.g. j.doe@institution.edu" required="" type="text"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="flex items-center text-sm font-semibold text-gray-700" for="password">
<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
            Password
          </label>
<div class="relative">
<input class="block w-full px-4 py-3 text-gray-900 border border-gray-200 rounded-theme focus:ring-brand focus:border-brand placeholder-gray-400 text-sm" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-gray-400 hover:text-gray-600" id="password-toggle">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-theme shadow-sm text-sm font-semibold text-white bg-brand hover:bg-brand-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand transition-colors duration-200" type="submit">
            Sign In to Dashboard
          </button>
</div>
</form>
</div>
</main>
</div>
<!-- END: LoginContainer -->
<script data-purpose="interactivity">
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('password-toggle');

    if (toggleIcon) {
      toggleIcon.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
      });
    }
  </script>
</body></html>
